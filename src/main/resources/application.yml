server:
  port: ${PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-agent-backend

  datasource:
    url: jdbc:h2:mem:ai_agent_backend;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: false

  ai:

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
    model:
      audio:
        speech: none
        transcription: none
      embedding:
        multimodal: none
        text: none
      image: none
      moderation: none

duffel:
  access-token: ${DUFFEL_ACCESS_TOKEN:}
